name: Release

# Publishes the universal macOS .dmg on the Releases page.
# Triggered when the app version in tauri.conf.json changes on main (or a v* tag is pushed):
# if no release exists for that version yet, it creates tag vX.Y.Z and the release.
on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish macOS release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'
        with:
          workspaces: src-tauri
      - if: steps.version.outputs.skip != 'true'
        run: npm ci
      - name: Release notes from CHANGELOG
        if: steps.version.outputs.skip != 'true'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            /^## \[/ && grab {exit}
            /^\[[0-9]/ {next}
            grab {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### ⬇️ Install
          1. Download **`MongoBoard_*_universal.dmg`** below (Apple Silicon + Intel, macOS 12+).
          2. Drag **MongoBoard** to **Applications**.
          3. First launch: right-click → **Open** (the app isn't notarized yet). If macOS says it's damaged, run `xattr -dr com.apple.quarantine /Applications/MongoBoard.app`.
          NOTES
          sed -i '' 's/^          //' notes.md
          {
            echo "body<<EOF"
            cat notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Updater signing
        if: steps.version.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Without the key, still publish the release but skip the auto-update files.
          if [ -z "$KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set: this release will not be offered as an automatic update."
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "EXTRA_ARGS=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v1
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: MongoBoard ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg ${{ env.EXTRA_ARGS }}
