name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux + real MongoDB)
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Typecheck + build frontend
        run: npm run build
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust tests (incl. MongoDB integration)
        working-directory: src-tauri
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: cargo test -- --include-ignored

  # Full universal builds are slow (~20 min); run them for pull requests or on demand.
  # Pushes to main are covered by the tests above, and tagged releases by release.yml.
  macos:
    name: macOS app (.dmg)
    runs-on: macos-15
    needs: test
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build universal app
        run: |
          # Update signing only happens in release.yml.
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/no-updater.json"
      - uses: actions/upload-artifact@v7
        with:
          name: MongoBoard-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
