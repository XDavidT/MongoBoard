[package]
name = "mongoboard"
version = "0.1.4"
description = "MongoBoard — a desktop MongoDB client"
edition = "2021"
license = "MIT"
repository = "https://github.com/XDavidT/MongoBoard"
keywords = ["mongodb", "gui", "studio3t-alternative", "robo3t-alternative", "nosqlbooster"]
categories = ["database", "gui"]
publish = false

[lib]
name = "mongoboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = { version = "3", features = ["aws-auth"] }
bson = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
base64 = "0.23"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
